[package]
name = "jasktv-engine"
version = "0.1.0"
description = "jaskTV's shared logic: account encryption and sync, release parsing (more to come: matching, providers, guide)"
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
regex-lite.workspace = true
# Title matching needs Unicode classes (\p{L}) and NFKC, as the app's Java regexes use.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-gencat", "unicode-case"] }
unicode-normalization = "0.1"
# The account encryption, matching the app's (P-256 ECDH, AES-256-GCM, SHA-256): pure-Rust RustCrypto crates.
p256 = { version = "0.13", default-features = false, features = ["ecdh", "pkcs8", "std"] }
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
