# jaskTV's Rust side: the shared engine (logic every client and core can use) and core (the home server).
[workspace]
members = ["engine", "core", "tray"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
regex-lite = "0.1"

# Small binaries: optimise for size, one codegen unit, link-time optimisation, no unwinding, symbols stripped.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
